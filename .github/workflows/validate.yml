name: validate

# Every other repository validates against what is in here, so nothing lands on main
# that the contract cannot vouch for. The job runs tools/check.py and nothing else: the
# same command, with the same arguments, that an author runs before pushing.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push landing while the previous one is still running makes the earlier answer
  # worthless, so it is abandoned rather than waited for.
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Schemas, keywords, examples and fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # The build fails on any of the checks tools/check.py lists at its top: among them,
      # the schemas are legal JSON Schema 2020-12 published under the $id they declare,
      # every keyword carries a description and examples that validate, every fixture
      # behaves as fixtures/index.json says it does, openapi.json is a sound OpenAPI 3.1
      # document held to the same rule, and its routes agree with the documentation's
      # route table, which the check reads from https://agentiik.github.io/docs/v/main/.
      # The keyword rule is the documentation's own: the language reference and the
      # workflow.language tool are generated from these fields, so a keyword without them
      # is a keyword the language reference cannot teach.
      - name: Check the contract
        run: python tools/check.py
